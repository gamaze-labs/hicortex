name: Sync Hermes plugin mirror

# Pushes hermes-plugin/hicortex/ to the read-only mirror repo
# gamaze-labs/hicortex-hermes-plugin so `hermes plugins install` works
# (the Hermes installer requires plugin.yaml at the repo ROOT and has no
# subdirectory support). The mirror is a generated artifact — never edit
# it directly; all changes come from this mono-repo.
#
# STATUS: needs a working push credential. gamaze-labs disables deploy keys,
# so HERMES_MIRROR_DEPLOY_KEY must be replaced with a fine-grained PAT
# (contents:write on the mirror) and the push step switched to HTTPS.
# Until then, run scripts/sync-hermes-plugin.sh manually after merges.

on:
  push:
    branches: [main]
    paths:
      - "hermes-plugin/hicortex/**"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Push plugin folder to mirror
        env:
          DEPLOY_KEY: ${{ secrets.HERMES_MIRROR_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          echo "$DEPLOY_KEY" > ~/.ssh/mirror_key
          chmod 600 ~/.ssh/mirror_key
          ssh-keyscan github.com >> ~/.ssh/known_hosts 2>/dev/null
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/mirror_key -o IdentitiesOnly=yes"

          SRC="$GITHUB_WORKSPACE/hermes-plugin/hicortex"
          TMP="$(mktemp -d)"
          cp -r "$SRC"/. "$TMP/"
          cd "$TMP"
          git init -q -b main
          git config user.name "hicortex-sync-bot"
          git config user.email "support@gamaze.com"
          git add -A
          git commit -q -m "sync from mha33/hicortex@${GITHUB_SHA::7}"
          git push --force git@github.com:gamaze-labs/hicortex-hermes-plugin.git main
