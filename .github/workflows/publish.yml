name: Publish to npm

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'npm dist-tag (latest | next)'
        required: true
        default: 'rc'
        type: choice
        options:
          - rc
          - next
          - latest

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/hicortex
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Pin npm to a version that supports Trusted Publishing
        run: npm install -g npm@latest

      - name: Install deps
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Pack tarball
        run: npm pack

      - name: Publish tarball
        run: |
          # Tag pushes publish to `rc` by default — nobody follows rc, so a
          # release is validated from the registry before `next`/`latest` are
          # moved (deliberate dist-tag step; see issue #119 flow). Use
          # workflow_dispatch with tag=latest/next only for explicit promotion
          # publishes of a NEW version.
          TAG="${{ github.event.inputs.tag || 'rc' }}"
          npm publish gamaze-hicortex-*.tgz --tag "$TAG" --access public
